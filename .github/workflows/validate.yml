name: Validate Holographic Card Studio

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install Pillow
      - run: python scripts/validate_plugin_bundle.py
      - run: npm test
        working-directory: plugins/holographic-card-preview
